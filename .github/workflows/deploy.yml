name: Verify and deploy SerpentAI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Engine, AI, match and inference tests (Vitest)
        run: npm test
      - name: Bundle the engine bridge for Python
        run: npm run build:node
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            rl/requirements.txt
            vision/requirements.txt
      - name: Install Python stack (CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r rl/requirements.txt -r vision/requirements.txt
      # Small learning smoke tests only — full BC/DAgger/PPO/vision training runs locally (docs/REINFORCEMENT_LEARNING.md).
      - name: Environment, rule-equivalence, learning-pipeline and vision tests (pytest)
        run: python -m pytest rl/tests vision/tests -q
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (Playwright, desktop + mobile emulation)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
